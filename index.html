<style>
/* Layout: sticky app bar + single working column; checklist items as score rows, state shown by colour of the item number */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#18241D; --muted:#5A6A60; --line:#D3DBD4;
  --accent:#1D5B3A; --accent-ink:#FFFFFF; --accent-soft:#DDEBE1;
  --good:#1E7A46; --good-soft:#DCEFE3; --fair:#9A6300; --fair-soft:#F6EAD2; --bad:#B3261E; --bad-soft:#F7DEDB; --na:#7D8A82; --na-soft:#E6EAE7;
  --f-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-doc:"Sarabun","IBM Plex Sans Thai",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --sunk:#1C2721; --ink:#E4ECE6; --muted:#9BAEA2; --line:#2B3A31;
  --accent:#6BBF8C; --accent-ink:#0E1411; --accent-soft:#1D3527;
  --good:#5CC389; --good-soft:#193726; --fair:#E3AA3E; --fair-soft:#3A2C12; --bad:#F2837B; --bad-soft:#3E1C1A; --na:#8C9A91; --na-soft:#232E28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --sunk:#1C2721; --ink:#E4ECE6; --muted:#9BAEA2; --line:#2B3A31;
  --accent:#6BBF8C; --accent-ink:#0E1411; --accent-soft:#1D3527;
  --good:#5CC389; --good-soft:#193726; --fair:#E3AA3E; --fair-soft:#3A2C12; --bad:#F2837B; --bad-soft:#3E1C1A; --na:#8C9A91; --na-soft:#232E28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-ui);-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;letter-spacing:.02em;flex:none}
.brand b{font-weight:700;font-size:1rem;display:block;line-height:1.2}
.brand span{font-size:.75rem;color:var(--muted);display:block;line-height:1.2}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.saving i{background:var(--fair)}
.sync.off i{background:var(--bad)}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel > h2,.panel > h3{margin-bottom:10px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* fields */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:15px;min-height:42px}
textarea{min-height:76px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;line-height:1.45}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .seg button,fieldset:disabled .photo-add{opacity:.55}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.pass{background:var(--good-soft);color:var(--good)}
.chip.fail{background:var(--bad-soft);color:var(--bad)}
.chip.draft{background:var(--fair-soft);color:var(--fair)}
.chip.t-LC{background:var(--accent-soft);color:var(--accent)}
.chip.t-SV{background:var(--good-soft);color:var(--good)}
.chip.t-CP{background:var(--bad-soft);color:var(--bad)}
.chip.t-OT{background:var(--na-soft);color:var(--ink)}
.chip.t-FU{background:var(--fair-soft);color:var(--fair)}
.fu-before{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:.88rem}
.fu-before .lbl{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fu-before .photos{margin-top:2px}
.fu-after-h{font-size:.74rem;font-weight:600;color:var(--muted)}
.chain{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.chain li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chain li .grow{flex:1;min-width:160px}
details.hist{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
details.hist summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.hist ol{margin:8px 0 0;padding-left:20px;display:grid;gap:8px}
.due{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.due.over{background:var(--bad-soft);color:var(--bad)}
.due.soon{background:var(--fair-soft);color:var(--fair)}
.headbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.navbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--accent);color:var(--surface);font-size:.72rem;font-weight:700;line-height:18px;text-align:center}
.chip.plan{background:var(--accent-soft);color:var(--accent)}
.planstrip{width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}
.plan-note{background:var(--accent-soft)}
h2.bad{color:var(--bad)}
.plancard{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plancard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plancard.over{border-color:var(--bad)}
.plandate{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:8px;border-radius:8px;background:var(--sunk);height:max-content}
.plandate b{font-size:.95rem}
.plancard.today .plandate{background:var(--accent);color:var(--surface)}
.plancard.over .plandate{background:var(--bad-soft);color:var(--bad)}
.planbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.planname{font-size:1.05rem}
.teamline{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:8px;background:var(--sunk)}
.teamchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;border:1px dashed var(--line);background:var(--surface);font-size:.84rem;opacity:.75}
.tchip small{color:var(--muted)}
.tchip i{font-style:normal;font-size:.72rem;font-weight:600;color:var(--muted)}
.tchip.on{border-style:solid;border-color:var(--good);opacity:1}
.tchip.on i{color:var(--good)}
.login{max-width:420px;margin:6vh auto 0}
.nav .acct{border:1px solid var(--line);border-radius:99px;color:var(--ink);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .area-pill:disabled{opacity:1;cursor:default}
@media (max-width:560px){.plancard{grid-template-columns:1fr}.plandate{flex-direction:row;gap:8px;align-items:center;width:100%}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* registry */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .no{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.li .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.li .meta{grid-column:2/4;display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.li .end{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.li-wrap{position:relative;border-top:1px solid var(--line)}
.li-wrap:first-child{border-top:0}
.li-wrap .li{border-top:0;padding-bottom:40px}
.li-acts{position:absolute;right:10px;bottom:6px;display:flex;gap:4px}
.btn.ghost.danger{color:var(--bad)}
.rpt .contactbox{margin-top:10px;padding:6px 10px;border:1px solid #999;border-radius:4px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* editor */
.ed-head{display:flex;flex-direction:column;gap:6px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,58px));z-index:10;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:8px 0;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:84px}
.tabs button b{font-size:.9rem;font-weight:600}
.tabs button span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button[aria-selected="true"] span{color:var(--bg);opacity:.8}

.cat{display:flex;flex-direction:column;gap:10px}
.catjump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,58px) + var(--tabsh,56px));z-index:9;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 16px;margin-inline:-16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.catjump::-webkit-scrollbar{display:none}
.catjump button{flex:1 0 auto;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;font:inherit;font-size:.85rem}
.catjump button span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.catjump button.done span{color:var(--good,#2E7D4F)}
.catjump button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cat{scroll-margin-top:calc(var(--barh,58px) + var(--tabsh,56px) + 56px)}
.cat-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-top:8px}
.cat-score{display:flex;align-items:center;gap:10px;font-size:.85rem}
.meter{width:120px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:99px}
.meter.low i{background:var(--bad)}
.meter::after{content:"";position:absolute;left:60%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.sub-h{font-weight:600;font-size:.9rem;color:var(--muted);padding:4px 2px 0}

.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.item.off{opacity:.55}
.item-top{display:flex;gap:10px;align-items:flex-start}
.ino{flex:none;font-family:var(--f-mono);font-size:.8rem;font-weight:500;min-width:52px;text-align:center;padding:3px 6px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.item[data-state="2"] .ino,.item[data-state="p"] .ino{background:var(--good-soft);color:var(--good)}
.item[data-state="1"] .ino{background:var(--fair-soft);color:var(--fair)}
.item[data-state="0"] .ino,.item[data-state="f"] .ino{background:var(--bad-soft);color:var(--bad)}
.item[data-state="na"] .ino{background:var(--na-soft);color:var(--na)}
.itext{min-width:0;flex:1}
.itext p{line-height:1.55}
.itext ul{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.mtag{display:inline-block;font-size:.7rem;font-weight:700;padding:0 6px;border-radius:4px;background:var(--bad);color:var(--surface);margin-left:6px;vertical-align:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.pf{grid-template-columns:repeat(3,1fr)}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;cursor:pointer;line-height:1.2;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seg button small{font-size:.7rem;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="2"],.seg button[aria-pressed="true"][data-v="p"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--fair);border-color:var(--fair);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="0"],.seg button[aria-pressed="true"][data-v="f"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);border-color:var(--na);color:var(--surface)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:.84rem;color:var(--muted);cursor:pointer;min-height:34px}
.tool b{color:var(--ink);font-weight:600}
.photo-add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-add{position:relative}
.rec{background:var(--sunk);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rec .spread span{font-size:.8rem;font-weight:600;color:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.ph.busy{display:grid;place-items:center;font-size:.75rem;color:var(--muted)}

/* summary */
.result-banner{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.result-banner.pass{background:var(--good-soft);color:var(--good)}
.result-banner.fail{background:var(--bad-soft);color:var(--bad)}
.result-banner.incomplete{background:var(--fair-soft);color:var(--fair)}
.result-banner b{font-size:1.25rem}
.result-banner p{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.78rem;color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.deflist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.deflist li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.deflist .ino{min-width:64px}

/* signatures */
.sig{display:flex;flex-direction:column;gap:8px}
.pad{position:relative;border:1px dashed var(--muted);border-radius:8px;background:#FFFFFF;height:170px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:8px;cursor:crosshair}
.pad .hint{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:#7A857E;pointer-events:none}
.pad::after{content:"";position:absolute;left:12px;right:12px;bottom:34px;border-bottom:1px solid #C7CFC9;pointer-events:none}
.sig-img{background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center}
.sig-img img{max-height:110px}

/* modal + toast */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);background:rgba(10,16,12,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.dialog{background:var(--surface);border-radius:14px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:calc(var(--vvh,100dvh) - 24px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dialog .acts{position:sticky;bottom:-20px;margin:0 -20px -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:2;justify-content:flex-end}
@media (max-width:560px){.dialog{padding:16px;border-radius:12px}.dialog .acts{bottom:-16px;margin:0 -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.dialog .acts .btn{flex:1;min-height:48px}}
.unitkind{display:flex;gap:6px}
.unitkind button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.unitkind button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dlg-xbar{position:sticky;top:-12px;height:0;display:flex;justify-content:flex-end;z-index:3;margin:-8px -10px 0 0;align-self:stretch;width:auto}
.dlg-x{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dlg-x:hover{background:var(--sunk)}
.dialog > .dlg-xbar + *{padding-right:40px}
.ins-row{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:4px;transition:background .15s}
.ins-row.dragging{opacity:.55;background:var(--sunk)}
.ins-row.drop{background:var(--accent-soft);outline:2px dashed var(--accent)}
.ins-handle{flex:none;width:40px;height:44px;margin-top:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:20px;cursor:grab;touch-action:none;user-select:none}
.ins-handle:active{cursor:grabbing}
.rules{margin:4px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rules li::before{content:"• ";}
.rules li.ok{color:var(--good)}.rules li.ok::before{content:"✓ "}
.rules li.bad{color:var(--bad)}.rules li.bad::before{content:"✗ "}
.rules li.info::before{content:"ⓘ "}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{flex:1;width:100%;padding-right:48px}
.pw-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px}
.pw-eye:hover{color:var(--ink)}.pw-eye:focus-visible{outline:2px solid var(--accent,#2E7D4F);outline-offset:-2px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:calc(100vw - 32px)}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.note.warn{background:var(--fair-soft)}
.note.bad{background:var(--bad-soft)}
.picklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.picklist button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer}
.picklist button:first-child{border-top:0}
.picklist button[aria-pressed="true"]{background:var(--accent-soft)}
.opt-group{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opt-group > .check{font-weight:600}
.opt-sub{padding-left:30px;display:flex;flex-direction:column}
.divider{height:1px;background:var(--line);margin:4px 0}

/* report (PDF) — fixed print palette, never themed */
#rptHolder{position:fixed;left:-12000px;top:0;width:718px;pointer-events:none}
.rpt{width:718px;background:#FFFFFF;color:#000000;font:13px/1.5 'RptSarabun','Sarabun',Tahoma,sans-serif;padding:0 0 4px}
.rpt *{color:#000000}
.rpt h1{font-size:17px;text-align:center;font-weight:700;margin:4px 0 2px}
.rpt h2{font-size:14px;font-weight:700;margin:10px 0 4px}
.rpt .formno{text-align:right;font-weight:700;font-size:13px}
.rpt .center{text-align:center}
.rpt p{margin:1px 0}
.rpt .fill{border-bottom:1px dotted #000000;padding:0 4px;display:inline;font-weight:600}
.rpt .cb{display:inline-block;width:11px;height:11px;border:1px solid #000000;margin:0 5px -1px 0;position:relative;background:#FFFFFF}
.rpt .cb.on::before{content:"";position:absolute;inset:2px;background:#000000}
.rpt .ind{padding-left:18px}
.rpt .ind2{padding-left:36px}
.rpt table{width:100%;border-collapse:collapse;margin:4px 0;font-size:12px}
.rpt th,.rpt td{border:1px solid #000000;padding:3px 5px;vertical-align:top}
.rpt th{background:#EDEDED;font-weight:700;text-align:center}
.rpt td.c{text-align:center;vertical-align:middle}
.rpt tr.sec td{background:#F4F4F4;font-weight:700}
.rpt tr.tot td{font-weight:700;background:#FAFAFA}
.rpt .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-top:10px}
.rpt .sigs.two{grid-template-columns:repeat(2,1fr)}
.rpt .sigbox{text-align:center;font-size:12px}
.rpt .sigbox .img{height:52px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px dotted #000000;margin-bottom:2px}
.rpt .sigbox img{max-height:50px;max-width:100%}
.rpt .validto{width:max-content;margin:2px 0 0 auto;border:1px solid #000;padding:1px 8px;font-size:12.5px}
.rpt .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rpt .photos figure{margin:0;border:1px solid #BBBBBB;padding:4px}
.rpt .photos img{width:100%;height:230px;object-fit:contain;background:#F5F5F5;display:block}
.rpt .photos figcaption{font-size:11.5px;margin-top:4px;line-height:1.4}
.rpt .photos figcaption b{font-size:12px}
.rpt .small{font-size:11.5px}
.rpt .hdrline{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #000000;margin-bottom:6px;padding-bottom:2px}

.area-pill{border:1px solid var(--accent)!important;color:var(--accent)!important;font-weight:600!important}
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.area-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-height:64px}
.area-card:hover{border-color:var(--accent)}
.area-card b{font-weight:600}
.area-card span{font-size:.8rem;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:500}

.missbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.missbar.done{background:var(--good);color:var(--surface)}
.missbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.misslist{display:flex;flex-wrap:wrap;gap:6px}
.misslist button{border:1px dashed var(--fair);background:var(--fair-soft);color:var(--ink);border-radius:6px;padding:4px 9px;font:500 .8rem var(--f-mono);cursor:pointer;min-height:30px}
.show-missing .item[data-state=""]{border:2px dashed var(--fair)}
.item.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 4px var(--fair)}100%{box-shadow:0 0 0 0 transparent}}
.presence{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;min-height:28px}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 2px;max-width:100%}
.who > span:nth-child(2){font-weight:600}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#FFFFFF;font-weight:600;font-size:.75rem;flex:none;line-height:1}
.tabs .avs{display:flex;align-items:center;margin-top:4px}
.av.sm{width:18px;height:18px;font-size:.62rem;margin-right:-4px;box-shadow:0 0 0 2px var(--surface)}
.tabs .avs .more{font-size:.68rem;margin-left:8px}
.joincode{font:600 2rem/1.2 var(--f-mono);letter-spacing:.18em;margin-top:2px;color:var(--ink)}
.joinbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}
.joinbar label{font-weight:600;font-size:.9rem}
.joinbar input{width:9em;min-height:36px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
.joinstack{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);pointer-events:none}
.joincard{display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:joinIn .35s cubic-bezier(.2,1.4,.4,1)}
.joincard .av{width:36px;height:36px;font-size:1rem}
.joincard.out{opacity:0;transform:translateY(-8px);transition:all .35s}
@keyframes joinIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.lobby{width:100%;border-top:1px solid var(--line);padding-top:10px}
.lobby-mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who .live{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.result-dlg{gap:12px;max-width:440px}
.result-hero{border-radius:14px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;animation:resPop .5s cubic-bezier(.2,1.5,.4,1)}
.result-hero.pass{background:var(--good-soft);color:var(--good)}
.result-hero.fail{background:var(--bad-soft);color:var(--bad)}
.result-hero .small{color:var(--ink)}
.result-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;font-weight:700;color:var(--surface);background:currentColor}
.result-hero.pass .result-mark{background:var(--good)} .result-hero.fail .result-mark{background:var(--bad)}
.result-mark{color:var(--surface)}
.result-word{font-size:1.6rem;font-weight:700;line-height:1.2}
.result-score{display:flex;flex-direction:column;align-items:center}
.result-score b{font-size:2.2rem;line-height:1.1}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
@keyframes resPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (max-width:560px){
  h1{font-size:1.25rem}
  .li{grid-template-columns:1fr auto}
  .li .no{grid-column:1/3}
  .li .meta{grid-column:1/3}
  .meter{width:80px}
  .brand span{display:none}
}
@media (max-width:720px){
  .bar{position:static}
  .tabs{top:env(safe-area-inset-top,0px)!important}
  .catjump{top:calc(env(safe-area-inset-top,0px) + var(--tabsh,56px))!important}
  .cat{scroll-margin-top:calc(var(--tabsh,56px) + 56px)}
}

<script>
const FORMS={"ts2": [{"h": "หมวดที่ 1 สถานที่ตั้ง อาคารผลิต การทำความสะอาด และการบำรุงรักษา"}, {"k": "1.1", "t": "ทำเลที่ตั้งต้องห่างจากแหล่งที่ก่อให้เกิดการปนเปื้อน เช่น สิ่งปฏิกูล วัตถุอันตราย คอกสัตว์ ฝุ่นควัน น้ำท่วมขัง", "d": [], "m": false, "rec": "ปรับปรุงหรือกำจัดแหล่งปนเปื้อนรอบสถานที่ผลิต เช่น ขยะ น้ำขัง คอกสัตว์ หรือจัดให้มีแนวป้องกัน (รั้ว/ผนังกั้น) ระหว่างแหล่งปนเปื้อนกับอาคารผลิต"}, {"k": "1.2", "t": "บริเวณโดยรอบอาคารผลิตและภายในอาคารผลิต ไม่มีการสะสมสิ่งของไม่ใช้แล้ว หรือไม่เกี่ยวข้องกับการผลิตอาหาร", "d": [], "m": false, "rec": "ขนย้ายสิ่งของที่ไม่ใช้แล้วและสิ่งที่ไม่เกี่ยวข้องกับการผลิตออกจากบริเวณผลิตและรอบอาคาร จัดพื้นที่ให้เป็นระเบียบ และกำหนดรอบตรวจความเรียบร้อย"}, {"k": "1.3", "t": "ภายนอกและภายในอาคารผลิต มีท่อหรือทางระบายน้ำที่เหมาะสม ลาดเอียงเพียงพอ ไม่อุดตัน ไม่ทำให้เกิดน้ำขังแฉะและสกปรก มีการออกแบบที่เหมาะสมกับทิศทางการระบายน้ำ", "d": [], "m": false, "rec": "ปรับปรุงรางระบายน้ำให้ลาดเอียงเพียงพอ ไม่อุดตัน มีตะแกรงหรือฝาปิดป้องกันสัตว์ ทำความสะอาดสม่ำเสมอ และไม่ให้น้ำไหลจากบริเวณสกปรกไปบริเวณสะอาด"}, {"h": "1.4 อาคารผลิต มั่นคง แข็งแรง ออกแบบง่ายต่อการทำความสะอาดและบำรุงรักษา สภาพสะอาด และไม่ชำรุด"}, {"k": "1.4.1", "t": "พื้น ใช้วัสดุคงทน เรียบ ทำความสะอาดง่าย มีความลาดเอียงเพียงพอลงสู่ทางระบายน้ำ สภาพสะอาด ไม่ชำรุด", "d": [], "m": false, "rec": "ซ่อมแซมพื้นที่ชำรุด แตกร้าว หรือมีน้ำขัง ให้เรียบ ทำความสะอาดง่าย ลาดเอียงลงสู่ทางระบายน้ำ และทำความสะอาดตามแผน"}, {"k": "1.4.2", "t": "ผนัง ใช้วัสดุคงทน เรียบ ทำความสะอาดง่าย สภาพ สะอาด ไม่ชำรุด", "d": [], "m": false, "rec": "ซ่อมแซมหรือทาสีผนังที่ชำรุด หลุดลอก หรือมีคราบรา ใช้วัสดุผิวเรียบทำความสะอาดง่าย และทำความสะอาดสม่ำเสมอ"}, {"k": "1.4.3", "t": "เพดาน ใช้วัสดุคงทน เรียบ ทำความสะอาดง่าย รวมทั้งอุปกรณ์ที่ยึดติดด้านบน ไม่ก่อให้เกิดการปนเปื้อน สภาพสะอาด ไม่ชำรุด", "d": [], "m": false, "rec": "ซ่อมแซมเพดานที่ชำรุด รั่วซึม หรือหลุดลอก ติดตั้งฝาครอบหลอดไฟและอุปกรณ์ด้านบนไม่ให้ร่วงหล่นลงอาหาร และกำจัดหยากไย่ฝุ่นละออง"}, {"k": "1.5", "t": "อาคารผลิตสามารถป้องกันสัตว์และแมลงเข้าสู่บริเวณผลิต หรือป้อง /* ============ images ============ */
async function shrink(file, max = 1600) {
  let bmp; try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); } catch { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);

async function imgToData(src) {
  return await new Promise(res => { const im = new Image(); im.onload = () => { try { const c = document.createElement('canvas'); const sc = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
    c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.85)); } catch { res(src); } };
    im.onerror = () => res(''); im.src = src; });
}
async function makePdf(btn, opts = {download:true}) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'กำลังสร้าง PDF…';
  const holder = $('#rptHolder');
  try {
    await flushAll();
    await Promise.all([loadScript(H2I), loadScript(JSPDF)]);
    await Promise.all([document.fonts.load("13px RptSarabun", 'ก'), document.fonts.load("700 13px RptSarabun", 'ก')]).catch(() => {});
    await loadFiles(allPhotoIds());
    const parts = buildReport(); holder.replaceChildren(...parts);
    for (const im of holder.querySelectorAll('img')) { if (im.getAttribute('src') && !im.src.startsWith('data:')) im.src = await imgToData(im.src); }
    await Promise.all([...holder.querySelectorAll('img')].map(im => im.decode ? im.decode().catch(() => {}) : 0));
    const fontCSS = $('#rptFontCss').textContent;
    const {jsPDF} = window.jspdf; const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    const MX = 10, MT = 10, CW = 190, CH = 275, pxPerMm = 718 / CW, pageH = Math.floor(CH * pxPerMm), R = 1.7;
    let first = true;
    for (const part of parts) {
      const top0 = part.getBoundingClientRect().top, H = part.offsetHeight;
      const rel = el => { const r = el.getBoundingClientRect(); return {t: Math.round(r.top - top0), b: Math.round(r.bottom - top0)}; };
      // tables whose header row repeats on every continued page
      const tables = [...part.querySelectorAll('table')].filter(t => t.tHead).map(t => { const a = rel(t), hd = rel(t.tHead); return {top:a.t, bottom:a.b, ht:hd.t, hb:hd.b}; });
      const hdr = part.querySelector('.hdrline'); const hl = hdr ? rel(hdr) : null; const hlH = hl ? hl.b - hl.t + 6 : 0;
      const firstRowTops = new Set(tables.map(t => t.hb));
      const cuts = [...new Set([...part.querySelectorAll('tr,p,h1,h2,.avoid,figure,.sigs,table,.hdrline')].map(e => rel(e).t))]
        .filter(v => v > 0 && !firstRowTops.has(v)).sort((a, b) => a - b);   // never leave a header alone at the bottom of a page
      const left0 = part.getBoundingClientRect().left;
      const pics = [...part.querySelectorAll('img')].filter(im => im.naturalWidth && im.naturalHeight).map(im => { const r = im.getBoundingClientRect();
        return {im, x:r.left - left0, y:r.top - top0, w:r.width, h:r.height, fit:getComputedStyle(im).objectFit, bg:getComputedStyle(im).backgroundColor}; });
      for (const o of pics) o.im.style.visibility = 'hidden';
      let canvas;
      try { canvas = await window.htmlToImage.toCanvas(part, {pixelRatio:R, backgroundColor:'#FFFFFF', fontEmbedCSS:fontCSS, cacheBust:false, width:718, height:H}); }
      finally { for (const o of pics) o.im.style.visibility = ''; }
      { const cx0 = canvas.getContext('2d');
        for (const o of pics) {
          if (o.bg && !/rgba\(0, 0, 0, 0\)|transparent/.test(o.bg)) { cx0.fillStyle = o.bg; cx0.fillRect(o.x * R, o.y * R, o.w * R, o.h * R); }
          let dw = o.w, dh = o.h, dx = o.x, dy = o.y;
          if (o.fit === 'contain' || o.fit === 'scale-down') { const sc = Math.min(o.w / o.im.naturalWidth, o.h / o.im.naturalHeight); dw = o.im.naturalWidth * sc; dh = o.im.naturalHeight * sc; dx = o.x + (o.w - dw) / 2; dy = o.y + (o.h - dh) / 2; }
          try { cx0.drawImage(o.im, dx * R, dy * R, dw * R, dh * R); } catch (e) { console.warn('img draw', e); }
        } }
      // a part that must stay on one page (บันทึกคำให้การ): shrink it to fit instead of splitting
      if (part.dataset.fit1) {
        if (!first) pdf.addPage(); first = false;
        const sc = Math.min(1, pageH / H), w = CW * sc, hmm = H / pxPerMm * sc;
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', MX + (CW - w) / 2, MT, w, hmm);
        continue;
      }
      let y = 0;
      while (y < H - 2) {
        const cont = y > 0 ? tables.find(t => y >= t.hb && y < t.bottom - 2) : null;   // page starts inside a table body
        const top = (y > 0 && hl ? hlH : 0) + (cont ? cont.hb - cont.ht : 0);          // space for repeated running header + column header
        let end = y + pageH - top;
        if (end < H) { const c = cuts.filter(v => v > y + 120 && v <= end); if (c.length) end = c[c.length - 1]; } else end = H;
        const sl = document.createElement('canvas'); sl.width = canvas.width; sl.height = Math.ceil((top + end - y) * R);
        const cx = sl.getContext('2d'); cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, sl.width, sl.height);
        let off = 0;
        if (y > 0 && hl) { cx.drawImage(canvas, 0, Math.round(hl.t * R), canvas.width, Math.round((hl.b - hl.t) * R), 0, 0, canvas.width, Math.round((hl.b - hl.t) * R)); off = hlH; }
        if (cont) { const hh = cont.hb - cont.ht; cx.drawImage(canvas, 0, Math.round(cont.ht * R), canvas.width, Math.round(hh * R), 0, Math.round(off * R), canvas.width, Math.round(hh * R)); off += hh; }
        cx.drawImage(canvas, 0, Math.round(y * R), canvas.width, Math.round((end - y) * R), 0, Math.round(off * R), canvas.width, Math.round((end - y) * R));
        if (!first) pdf.addPage(); first = false;
        pdf.addImage(sl.toDataURL('image/jpeg', 0.8), 'JPEG', MX, MT, CW, (top + end - y) / pxPerMm);

    }
    const n = pdf.getNumberOfPages(); for (let k = 1; k <= n; k++) { pdf.setPage(k); pdf.setFontSize(8); pdf.setTextColor(110); pdf.text(k + ' / ' + n, 200, 291, {align:'right'}); }
    const blob = pdf.output('blob');
    const fname = (S.cur.insp.no || 'inspection') + ((S.cur.insp.edition || 1) > 1 ? '_ฉบับที่' + S.cur.insp.edition : '') + '_' + (S.cur.insp.pname || '').replace(/[\\/:*?"<>|]/g, '').slice(0, 40) + '.pdf';
    btn.textContent = 'กำลังบันทึกเข้า Drive…';
    const r = await API('savePdf', {id:S.cur.id, b64:await blobToB64(blob), name:fname});
    S.cur.insp.pdfId = r.pdfId;
    S.lastPdf = {blob, fname, id:S.cur.id, ver:S.cur.version};
    if (opts.download) { saveBlob(blob, fname); toast('สร้าง PDF แล้ว และเก็บสำเนาไว้ใน Drive'); }
    return true;
  } catch (e) {
    console.warn(e);
    toast('สร้าง PDF ไม่สำเร็จ: ' + errText(e), 6000); return false;
  } finally { holder.replaceChildren(); btn.disabled = false; btn.textContent = old; }
}

/* ============ browser back / forward ============ */
const NAV = {popping:false, key:'', ready:false};
function navState() {
  if (!S.token || !S.user) return {a:S.authView || 'login'};
  if (!S.act && S.view !== 'edit' && !isGuest()) return {v:'act'};
  if (!S.area && !isGuest() && !actMod() && S.view !== 'edit') return {v:'area'};
  const st = {v:S.view};
  if (S.view === 'edit' && S.cur) { st.id = S.cur.id; st.t = S.tab; }
  if (S.view === 'place') st.pl = S.placeId || null;
  if (S.view === 'dplace') st.dpl = S.dplaceId || null;
  if (S.view === 'record') st.rec = S.recId || null;
  return st;
}
function navWrite(st, replace) {
  try {
    if (IN_GAS) { if (google.script.history) google.script.history[replace ? 'replace' : 'push'](st, {}); }
    else history[replace ? 'replaceState' : 'pushState'](st, '', location.pathname + location.search);
  } catch {}
}
function navSync() {
  if (NAV.popping || !NAV.ready) return;
  const st = navState(), key = JSON.stringify(st); if (key === NAV.key) return;
  const prev = NAV.key ? JSON.parse(NAV.key) : null; NAV.key = key;
  // first entry, or only the tab inside the same inspection changed -> replace (back leaves the inspection, not each tab)
  const replace = !prev || (prev.v === 'edit' && st.v === 'edit' && prev.id === st.id);
  navWrite(st, replace);
}
async function navApply(st) {
  if (!st) return;
  // back while a window is open = close the window
  const open = document.querySelectorAll('.scrim:not(.keep)');
  if (open.length) { open.forEach(x => x.remove()); S.fastPoll = false; if (NAV.key) navWrite(JSON.parse(NAV.key), false); return; }
  NAV.popping = true;
  try {
    if (st.a) { if (!S.user) { S.authView = st.a; S._fp = null; render(); } else navWrite(JSON.parse(NAV.key), false); return; }
    if (!S.user) return;
    if (st.v === 'act') { if (S.view === 'edit') { leaveEditor(); S.cur = null; } S.act = ''; S.view = 'reg'; render(); }
    else if (st.v === 'area') { if (S.view === 'edit') { leaveEditor(); S.cur = null; } S.view = 'reg'; S.area = multiArea() ? '' : S.area; render(); }
    else if (st.v === 'edit' && st.id) {
      if (S.view !== 'edit' || !S.cur || S.cur.id !== st.id) await openEditor(st.id);
      if (S.cur && S.cur.id === st.id && st.t && st.t !== S.tab) { S.tab = st.t; drawTabs(); redrawTab(); }
    }
    else go(st.v, st.v === 'place' ? {placeId:st.pl} : st.v === 'record' ? {recId:st.rec} : st.v === 'dplace' ? {dplaceId:st.dpl} : null);
  } finally { NAV.popping = false; NAV.key = JSON.stringify(navState()); }
}
try {
  if (IN_GAS && google.script.history && google.script.history.setChangeHandler) google.script.history.setChangeHandler(e => navApply(e.state));
  else window.addEventListener('popstate', e => navApply(e.state));
} catch {}

/* every pop-up gets a close (X) button: it presses the dialog's own cancel/close button when there is one */
function addCloseX(sc) {
  const dlg = sc.querySelector('.dialog'); if (!dlg || dlg.querySelector('.dlg-x') || sc.classList.contains('noclose')) return;
  const x = h('button', {type:'button', class:'dlg-x', 'aria-label':'ปิดหน้าต่าง', title:'ปิดหน้าต่าง', onclick: () => {
    const own = [...dlg.querySelectorAll('button')].find(b => b !== x && /^(ยกเลิก|ปิด|ไม่ใช่|ไว้ทีหลัง)$/.test(b.textContent.trim()));
    if (own) own.click(); else { sc.remove(); S.fastPoll = false; } }}, '×');
  dlg.prepend(h('div', {class:'dlg-xbar'}, x));
}
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1 && n.classList.contains('scrim')) addCloseX(n); }).observe(document.body, {childList:true});
/* keep dialogs inside the part of the screen the keyboard doesn't cover (LINE / Chrome on phones) */
(function () {
  const vv = window.visualViewport; if (!vv) return;
  const set = () => { const r = document.documentElement.style; r.setProperty('--vvh', Math.round(vv.height) + 'px'); r.setProperty('--vvt', Math.round(vv.offsetTop) + 'px'); };
  vv.addEventListener('resize', set); vv.addEventListener('scroll', set); set();
  document.addEventListener('focusin', e => { const t = e.target; if (!t.closest || !t.closest('.dialog') || !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    setTimeout(() => { try { t.scrollIntoView({block:'center', behavior:'smooth'}); } catch {} }, 300); });
})();

ITEMS.gpp = GPP.flatMap(c => c.items.map(it => ({...it, cat:c.n})));
ITEMS.pre = PRE.flatMap(c => c.items.filter(it => it.k).map(it => ({...it, cat:c.n})));
const DSTM = {
  prop:'ในการตรวจครั้งนี้ผู้ประเมินและคณะมิได้ทำให้ทรัพย์สินของผู้รับอนุญาต / ผู้ดำเนินกิจการ / ผู้มีหน้าที่ปฏิบัติการ รวมถึงผู้เกี่ยวข้องสูญหายหรือเสียหายแต่อย่างใด ข้าพเจ้าได้อ่าน / อ่านให้ฟังแล้ว รับรองว่าถูกต้องจึงได้ลงลายมือชื่อไว้เป็นสำคัญ',
  propPre:'ในการตรวจครั้งนี้ เจ้าหน้าที่มิได้ทำให้ทรัพย์สินของผู้ประกอบธุรกิจ สูญหาย หรือเสียหาย แต่อย่างใด อ่านให้ฟังแล้ว/อ่านดูเอง รับรองว่าถูกต้องจึงได้ลงลายมือชื่อไว้เป็นสำคัญ',
  ack:'ผู้รับอนุญาต และเภสัชกรผู้มีหน้าที่ปฏิบัติการ ต่างทราบตรงกันเกี่ยวกับการที่เภสัชกรผู้มีหน้าที่ปฏิบัติการจะต้องมาปฏิบัติหน้าที่ ณ ร้านยา ตามเวลาที่ระบุ อย่างเคร่งครัด',
  due: d => 'โดยให้ดำเนินการแก้ไขให้แล้วเสร็จภายในวันที่ ' + d + ' กรณีพ้นจากวันดังกล่าวท่านต้องมารับเอกสารคำขอพร้อมหลักฐานคืน และห้ามมิให้มีการจำหน่ายยาและ/หรือเปิดดำเนินกิจการขายยา มิฉะนั้นจะถูกดำเนินการตามพระราชบัญญัติยา พ.ศ. ๒๕๑๐'};
const PRE_OPINION = [['allow','เห็นควรอนุญาต'], ['fix','เห็นควรอนุญาตเมื่อดำเนินการแก้ไขแล้วเสร็จ'], ['deny','ไม่เห็นควรอนุญาต']];

/* ============ พ.ร.บ.ยา: logic, views, editor tabs, PDF ============ */
const isDrug = i => ((i || (S.cur && S.cur.insp) || {}).act === 'drug');
const typeLabel = i => (!i ? '' : i.act === 'herb' || HTYPE[i.type] ? HTYPE[i.type] : i.act === 'drug' || DTYPE[i.type] ? DTYPE[i.type] : TYPE[i.type]) || '';
const DRES = {pass:'ผ่าน', fail:'ไม่ผ่าน', incomplete:'ยังประเมินไม่ครบ'};
const DRES_PRE = {pass:'ผ่านการประเมิน', fail:'ต้องปรับปรุงแก้ไข', incomplete:'ยังประเมินไม่ครบ'};
const dresLabel = (i, r) => ((i && i.dform === 'pre') ? DRES_PRE : DRES)[r] || '';
const PH_ST = {found:'พบเภสัชกร', absent:'ไม่พบเภสัชกร (อยู่ในเวลาปฏิบัติการ)', off:'ไม่พบ (นอกเวลาปฏิบัติการของคนนี้)'};
function phList(i) { const ph = (i || S.cur.insp).ph || {}; return Object.keys(ph).sort((a, b) => a - b).map(k => ({k, ...ph[k]})).filter(x => String(x.name || '').trim()); }
const phLine = x => x.name + (x.lic ? ' (ภ.' + String(x.lic).replace(/^ภ\.?\s*/, '') + ')' : '') + (x.hours ? ' เวลาปฏิบัติการ ' + x.hours + ' น.' : '');
const dItemLabel = (f, k) => (f === 'gpp' ? 'ข้อ ' : 'ข้อ ') + k;

/* ---- scoring ---- */
function dcalc(i, res) {
  res = res || {}; const f = i.dform === 'pre' ? 'pre' : 'gpp';
  const out = {form:f, cats:[], deficits:[], cd:[], answered:0, needed:0, result:'incomplete'};
  const phs = phList(i), st = res.ph || {};
  const pend = phs.filter(p => !st[p.k]), absent = phs.filter(p => st[p.k] === 'absent'), found = phs.filter(p => st[p.k] === 'found');
  out.ph = {list:phs, pending:pend.length, absent, found, none:!phs.length};
  if (f === 'gpp') {
    for (const c of GPP) {
      let full = 0, got = 0, done = 0, n = 0; const cd = [];
      for (const it of c.items) { n++; const v = itemVal(res, 'gpp', it.k);
        if (v.s === 'na' && it.cut) { done++; continue; }
        if (v.s === 0 || v.s === 1 || v.s === 2) { done++; full += 2 * it.w; got += v.s * it.w;
          if (v.s < 2) out.deficits.push({form:'gpp', it, v});
          if (it.cd && v.s === 0) cd.push(it); } }
      out.cats.push({n:c.n, title:c.title, short:c.short, sumTitle:c.sumTitle || c.title, full, got, pct:pct(got, full), done, total:n, cd});
      out.answered += done; out.needed += n;
      if (cd.length) out.cd.push({n:c.n, label:'หมวดที่ ' + c.n + ' ' + c.short + ': ข้อ ' + cd.map(x => x.k).join(', ')});
    }

const HERB = [{"n": 1,"title": "สถานที่","items": [{"k": "1.1","t": "สถานที่ขายต้องมีความมั่นคง มีทะเบียนบ้านที่ออกให้โดยส่วนราชการที่เกี่ยวข้อง ในกรณีที่เป็นอาคารชุด ต้องมีพื้นที่อนุญาตให้ประกอบกิจการไม่ใช่ที่พักอาศัย","ref": "B ข้อ 7","g": "ดูสำเนาทะเบียนบ้านของสถานที่ อาคารชุดต้องมีหลักฐานว่าพื้นที่อนุญาตให้ประกอบกิจการที่ไม่ใช่ที่พักอาศัย","sh": "ทะเบียนบ้าน/พื้นที่ประกอบกิจการ"},{"k": "1.2","t": "สถานที่ขายต้องมีความมั่นคง แข็งแรง ก่อสร้างด้วยวัสดุที่คงทนถาวร เป็นสัดส่วนชัดเจน","ref": "B ข้อ 7","g": "ดูโครงสร้างอาคาร วัสดุคงทนถาวร พื้นที่ขายเป็นสัดส่วน ถ้ามีกิจการอื่นต้องแยกหรือชี้บ่งพื้นที่ชัดเจน (B ข้อ 7(5))","sh": "ความมั่นคงแข็งแรง เป็นสัดส่วน"},{"k": "1.3","t": "สถานที่ขายและพื้นที่เก็บสำรองผลิตภัณฑ์ ต้องถูกสุขลักษณะ สะอาด เป็นระเบียบเรียบร้อย มีการควบคุมป้องกันสัตว์ และแมลงรบกวน","ref": "B ข้อ 7","g": "ดูความสะอาด ร่องรอยสัตว์และแมลง และมาตรการป้องกัน เช่น มุ้งลวด ประตูปิดสนิท (B ข้อ 7(3))","sh": "สุขลักษณะ การป้องกันสัตว์และแมลง"},{"k": "1.4","t": "สถานที่ขายและพื้นที่เก็บสำรองผลิตภัณฑ์ต้องมีสภาวะอุณหภูมิและความชื้นที่เหมาะสมต่อการรักษาคุณภาพ และสามารถป้องกันแสงแดดไม่ให้ส่องโดยตรงถึงผลิตภัณฑ์","ref": "B ข้อ 7","g": "แสงแดดต้องไม่ส่องถึงผลิตภัณฑ์ ดูการระบายอากาศ ความชื้น และบันทึกอุณหภูมิถ้ามี","sh": "อุณหภูมิ ความชื้น และแสงแดด"},{"k": "1.5","t": "สถานที่ขายต้องมีแสงสว่างเพียงพอในการอ่านเอกสาร อ่านฉลากผลิตภัณฑ์และป้ายแสดงต่างๆ ได้อย่างชัดเจน","ref": "A มาตรา 30","g": "แสงสว่างพอให้อ่านฉลาก เอกสารกำกับ และป้ายได้ชัดเจน (A มาตรา 30(2))","sh": "แสงสว่างเพียงพอ"},{"k": "1.6","t": "บริเวณจัดวางผลิตภัณฑ์ในพื้นที่ขาย จะต้องมีพื้นที่เพียงพอในการจัดวางผลิตภัณฑ์แยกตามประเภทของผลิตภัณฑ์ (สำเร็จรูป/วัตถุดิบ) เพื่อป้องกันการปะปนกัน และไม่ปะปนกับผลิตภัณฑ์สุขภาพอื่น","ref": "A มาตรา 30 และ 33","g": "แยกวางตามหมวดหมู่ แยกสำเร็จรูปกับวัตถุดิบ ไม่ปะปนกับผลิตภัณฑ์สุขภาพอื่น (A มาตรา 30(1), 33(2); B ข้อ 7(4))","sh": "การจัดวางแยกประเภท ไม่ปะปน"},{"k": "1.7","t": "กรณีมีพื้นที่เก็บสำรองเป็นการเฉพาะจะต้องมีพื้นที่เพียงพอสำหรับการจัดเก็บรักษาอย่างเป็นระเบียบ เหมาะสม และไม่วางผลิตภัณฑ์สมุนไพรสำเร็จรูปหรือวัตถุดิบสัมผัสกับพื้นโดยตรง (ตัดฐานคะแนนได้ หากไม่มีพื้นที่เก็บสำรองเป็นการเฉพาะ)","ref": "B ข้อ 7","g": "พื้นที่เก็บพอเหมาะกับปริมาณ เป็นระเบียบ มีชั้นหรือพาเลท ไม่วางสัมผัสพื้น ตัดฐานได้ถ้าไม่มีพื้นที่เก็บสำรองเฉพาะ","sh": "พื้นที่เก็บสำรอง ไม่วางสัมผัสพื้น","cut": 1}]},{"n": 2,"title": "ป้ายและอุปกรณ์","items": [{"k": "2.1","t": "มีป้าย “สถานที่ขายผลิตภัณฑ์สมุนไพร” ซึ่งจัดทำป้ายด้วยวัตถุถาวรสีเขียว มีขนาดกว้าง ≥ 20 ซม. × ยาว ≥ 70 ซม. ตัวอักษรสีขาวอ่านได้ชัดเจน สูง ≥ 3 ซม.","ref": "A มาตรา 28 (4) C ข้อ 3","g": "วัดป้าย กว้าง ≥ 20 ซม. ยาว ≥ 70 ซม. พื้นสีเขียว อักษรสีขาวสูง ≥ 3 ซม. วัสดุถาวร","sh": "ป้ายสถานที่ขายผลิตภัณฑ์สมุนไพร (ขนาด/สี)"},{"k": "2.2","t": "ป้าย “สถานที่ขายผลิตภัณฑ์สมุนไพร” ติดในตำแหน่งที่เปิดเผยเห็นได้ง่ายจากภายนอกอาคาร","ref": "C ข้อ 3","g": "ป้ายติด ณ ที่เปิดเผยหน้าสถานที่ เห็นได้ง่ายจากภายนอกอาคาร","sh": "ตำแหน่งติดตั้งป้ายสถานที่"},{"k": "2.3","t": "มีป้ายแสดงชื่อตัว ชื่อสกุล วิทยฐานะของผู้มีหน้าที่ปฏิบัติการ รูปถ่ายผู้มีหน้าที่ปฏิบัติการ เลขที่ใบประกอบโรคศิลปะ/วิชาชีพและเวลาปฏิบัติการ ซึ่งจัดทำป้ายด้วยวัตถุถาวรสีเขียว มีขนาดกว้าง ≥ 20 ซม. × ยาว ≥ 70 ซม. ตัวอักษรสีขาวอ่านได้ชัดเจน สูง ≥ 3 ซม. (รูปถ่ายหน้าเต็ม รูปสี ถ่ายไว้ไม่เกิน 5 ปี ขนาดกว้าง ≥ 10 ซม. × ยาว ≥ 15 ซม.)","ref": "C ข้อ 3","g": "ป้ายระบุชื่อ-สกุล วิทยฐานะ เลขที่ใบอนุญาตประกอบวิชาชีพ เวลาปฏิบัติการ ขนาดและสีตามข้อ 2.1 รูปสีหน้าตรง ถ่ายไม่เกิน 5 ปี ≥ 10 × 15 ซม.","sh": "ป้ายผู้มีหน้าที่ปฏิบัติการ (ข้อมูล/ขนาด/รูปถ่าย)"},{"k": "2.4","t": "ป้ายแสดงชื่อตัว ชื่อสกุล วิทยฐานะของผู้มีหน้าที่ปฏิบัติการติดในตำแหน่งที่เปิดเผยเห็นได้ง่ายจากภายนอกอาคาร","ref": "C ข้อ 3","g": "ป้ายผู้มีหน้าที่ปฏิบัติการติดในที่เปิดเผย เห็นได้ง่ายจากภายนอกอาคาร","sh": "ตำแหน่งติดตั้งป้ายผู้มีหน้าที่ปฏิบัติการ"},{"k": "2.5","t": "มีการแสดงใบอนุญาตสถานที่ขายผลิตภัณฑ์สมุนไพร ติดไว้ในที่เปิดเผย เห็นได้ง่าย ณ สถานที่ขาย","ref": "C ข้อ 4","g": "ใบอนุญาตติดในที่เปิดเผย เห็นได้ง่าย ณ สถานที่ขาย (C ข้อ 4)","sh": "การแสดงใบอนุญาตสถานที่"},{"k": "2.6","t": "มีการแสดงใบประกอบโรคศิลปะ/วิชาชีพของผู้มีหน้าที่ปฏิบัติการ ครบทุกคน ติดไว้ในที่เปิดเผย เห็นได้ง่าย ณ สถานที่ขาย","ref": "C ข้อ 3","g": "ใบประกอบวิชาชีพหรือวุฒิการศึกษาของผู้มีหน้าที่ปฏิบัติการทุกคน ติดในที่เปิดเผย (C ข้อ 4)","sh": "การแสดงใบประกอบวิชาชีพ/โรคศิลปะ"},{"k": "2.7","t": "จัดให้มีอุปกรณ์ที่ใช้ในการขายผลิตภัณฑ์สมุนไพรสำเร็จรูปหรือวัตถุดิบให้เหมาะสมกับชนิดของผลิตภัณฑ์นั้นๆ และมีการดูแลให้อยู่ในสภาพที่ดีพร้อมใช้งาน เช่น เครื่องชั่ง 2 แขน หรือเครื่องชั่งตามความเหมาะสม ถาดนับ เป็นต้น รวมถึงภาชนะบรรจุสมุนไพรประเภทวัตถุดิบ","ref": "B ข้อ 8 (1)","g": "ดูเครื่องชั่ง ถาดนับ ภาชนะบรรจุวัตถุดิบ สะอาดและพร้อมใช้","sh": "อุปกรณ์การขายและภาชนะบรรจุ"}]},{"n": 3,"title": "บุคลากร","items": [{"k": "3.1","t": "ผู้มีหน้าที่ปฏิบัติการมีความรู้และผ่านการอบรมหลักสูตรตามที่ อย. กำหนด (มีผลบังคับ 15 มี.ค. 2570) กรณีสถานที่ได้รับอนุญาตก่อนประกาศมีผลบังคับใช้ ต้องทราบช่องทางการอบรมตามหลักสูตรที่ อย. กำหนด","ref": "A มาตรา 28 (1) D ข้อ 7","g": "ดูหลักฐานการอบรมหลักสูตรที่ อย. รับรอง ผู้มีหน้าที่ฯ อยู่ประจำตลอดเวลาทำการ ไม่ประจำหลายแห่งในเวลาเดียวกัน (D ข้อ 8–9)","sh": "การอบรมผู้มีหน้าที่ปฏิบัติการ"},{"k": "3.2","t": "พนักงานช่วยขายมีความรู้เกี่ยวกับการใช้ผลิตภัณฑ์สมุนไพรสำเร็จรูปหรือวัตถุดิบทุกประเภทที่มีขาย และผ่านการอบรมอย่างต่อเนื่องและเพียงพอ (ข้อมูลจากการสอบถามหรือหลักฐานการอบรม อย่างใดอย่างหนึ่ง)","ref": "B ข้อ 8(2) และ 9(7)","g": "สอบถามความรู้การใช้ผลิตภัณฑ์ที่ขาย หรือดูหลักฐานการอบรม ตัดฐานได้ถ้าไม่มีบุคลากรอื่น","sh": "ความรู้และการอบรมพนักงานช่วยขาย","cut": 1},{"k": "3.3","t": "หากมีบุคลากรอื่นในสถานที่ขายนอกจากผู้มีหน้าที่ปฏิบัติการต้องมีป้ายชื่อแสดงตนให้ชัดเจน","ref": "B ข้อ 8(2) และ 9(7)","g": "บุคลากรอื่นมีป้ายชื่อ แยกจากผู้มีหน้าที่ปฏิบัติการได้ ตัดฐานได้ถ้าไม่มีบุคลากรอื่น","sh": "ป้ายชื่อบุคลากรอื่น","cut": 1},{"k": "3.4","t": "มีข้อกำหนดเป็นลายลักษณ์อักษรเกี่ยวกับหน้าที่ความรับผิดชอบของผู้มีหน้าที่ปฏิบัติการ และบุคลากรอื่นในสถานที่ขายไว้ชัดเจน โดยข้อกำหนดดังกล่าวต้องคำนึงถึงความถูกต้องตามกฎหมาย","ref": "B ข้อ 8(2) และ 9(7)","g": "ดูเอกสารกำหนดหน้าที่ของผู้มีหน้าที่ฯ และบุคลากรอื่น เป็นลายลักษณ์อักษร ตัดฐานได้ถ้าไม่มีบุคลากรอื่น","sh": "ข้อกำหนดหน้าที่ความรับผิดชอบ","cut": 1}]},{"n": 4,"title": "การควบคุมคุณภาพผลิตภัณฑ์สำเร็จรูปและวัตถุดิบ","items": [{"k": "4.1","t": "มีการคัดเลือกและจัดหาผลิตภัณฑ์สมุนไพรสำเร็จรูปและวัตถุดิบจากผู้ผลิต ผู้นำเข้า หรือผู้ขายที่มีมาตรฐานและถูกต้องตามกฎหมาย (ไม่พบผลิตภัณฑ์ไม่มีทะเบียน)","ref": "B ข้อ 8(3)","g": "สุ่มดูเลขทะเบียน/เลขจดแจ้งบนฉลาก และใบส่งของจากผู้จำหน่ายที่ได้รับอนุญาต ต้องไม่พบผลิตภัณฑ์ไม่มีทะเบียน","sh": "แหล่งจัดซื้อและทะเบียนผลิตภัณฑ์"},{"k": "4.2","t": "มีการจัดทำบัญชีและรายงานเกี่ยวกับการซื้อและการขายที่ถูกต้องเป็นปัจจุบัน (ยังไม่มีรายชื่อสมุนไพรที่ต้องจัดทำบัญชีและรายงาน)","ref": "A มาตรา 28(5) E ข้อ 5 F ข้อ 6","g": "รายงาน รง. 7 และบัญชี บผ. 4 เฉพาะรายการที่เลขาธิการประกาศ (ขณะนี้ยังไม่มีรายการที่ต้องจัดทำ)","sh": "บัญชีและรายงานการซื้อขาย"},{"k": "4.3","t": "มีระบบตรวจสอบผลิตภัณฑ์สมุนไพรสำเร็จรูปและวัตถุดิบที่หมดอายุหรือเสื่อมคุณภาพ ไม่มีผลิตภัณฑ์หมดอายุ หรือเสื่อมคุณภาพไว้ ณ จุดขาย","ref": "B ข้อ 8(3)","g": "ถามวิธีตรวจวันหมดอายุ สุ่มดูผลิตภัณฑ์ ต้องไม่พบของหมดอายุหรือเสื่อมคุณภาพ ณ จุดขาย","sh": "ระบบตรวจสอบวันหมดอายุ/เสื่อมคุณภาพ"},{"k": "4.4","t": "กรณีพบผลิตภัณฑ์สมุนไพรสำเร็จรูปและวัตถุดิบที่หมดอายุหรือเสื่อมคุณภาพ มีการส่งคืนหรือทำลายตามหลักวิชาการ ไม่เป็นปัญหากับสิ่งแวดล้อม รวมถึงระบบการป้องกันการนำผลิตภัณฑ์ดังกล่าวไปจำหน่าย","ref": "B ข้อ 8(3)","g": "ดูวิธีส่งคืนหรือทำลาย และการแยกเก็บพร้อมป้ายชี้บ่ง เพื่อไม่ให้นำไปขาย","sh": "การส่งคืน/ทำลายผลิตภัณฑ์หมดอายุ"},{"k": "4.5","t": "มีระบบการคืนหรือเปลี่ยนผลิตภัณฑ์สมุนไพรสำเร็จรูปและวัตถุดิบ หากมีข้อบกพร่องโดยคำนึงถึงประสิทธิภาพของผลิตภัณฑ์และความปลอดภัยของผู้ใช้","ref": "B ข้อ 8(3)","g": "ถามขั้นตอนรับคืนหรือเปลี่ยนผลิตภัณฑ์ที่บกพร่อง","sh": "ระบบคืนหรือเปลี่ยนผลิตภัณฑ์"},{"k": "4.6","t": "จัดให้มีระบบรับเรื่องร้องเรียน และการจัดการเรื่องร้องเรียน เช่น ปัญหาคุณภาพของผลิตภัณฑ์สมุนไพร การให้บริการของร้าน หรือเรียกเก็บผลิตภัณฑ์สมุนไพรคืน กรณี อย. ให้เรียกเก็บ เป็นต้น","ref": "B ข้อ 8(3)","g": "ดูช่องทางรับเรื่องร้องเรียน แบบบันทึก และขั้นตอนเรียกคืนเมื่อ อย างรายงานอาการไม่พึงประสงค์ต่อ อย. (E ข้อ 5(4))","sh": "การเฝ้าระวังและรายงานอาการไม่พึงประสงค์"},{"k": "5.8","t": "มีกระบวนการคัดกรองและส่งต่อผู้ป่วยที่เหมาะสม","ref": "B ข้อ 9(6)","g": "ถามเกณฑ์คัดกรองผู้ป่วยที่เกินขอบเขต และการส่งต่อสถานพยาบาล","sh": "การคัดกรองและส่งต่อผู้ป่วย"},{"k": "5.9","t": "การจัดวางสื่อให้ความรู้และสื่อโฆษณาสำหรับผู้มารับบริการจะต้องผ่านการอนุญาตถูกต้องตามกฎหมาย ไม่มีข้อความโอ้อวด ไม่บิดเบือนความจริงหรือสร้างความเข้าใจผิดให้ผู้บริโภค (ตัดฐานคะแนนได้หากไม่มีสื่อให้ความรู้หรือสื่อโฆษณาในร้าน)","ref": "J","g": "ดูเลขที่ใบอนุญาตโฆษณาบนสื่อ ข้อความไม่โอ้อวด ไม่เป็นเท็จ ตัดฐานได้ถ้าไม่มีสื่อในร้าน","sh": "สื่อให้ความรู้และสื่อโฆษณา","cut": 1},{"k": "5.10","t": "ไม่จำหน่ายผลิตภัณฑ์สมุนไพรหรือเครื่องดื่มที่มีส่วนผสมของแอลกอฮอล์","ref": "K","g": "ต้องไม่พบการขายผลิตภัณฑ์หรือเครื่องดื่มที่มีแอลกอฮอล์","sh": "ไม่จำหน่ายเครื่องดื่ม/ผลิตภัณฑ์ผสมแอลกอฮอล์"},{"k": "5.11","t": "ไม่จำหน่ายผลิตภัณฑ์ยาสูบหรือบุหรี่","ref": "L","g": "ต้องไม่พบการขายยาสูบหรือบุหรี่","sh": "ไม่จำหน่ายยาสูบ/บุหรี่"}]}];

function hcalc(i, res) {
  res = res || {}; const out = {cats:[], issues:[], fixes:[], sugs:[], got:0, base:0, pending:0, failCount:0, noRec:[]};
  const std = +((res.hsum || {}).days) || HERB_DUE_DAYS;
  for (const c of HERB) {
    let got = 0, base = 0, pend = 0, cut = 0, fail = 0;
    for (const it of c.items) { const v = itemVal(res, 'herb', it.k);
      if (v.s === 'p') { got++; base++; } else if (v.s === 'f') { base++; fail++; } else if (v.s === 'na' && it.cut) cut++; else pend++;
      const rec = String(v.r || '').trim();
      if (v.s === 'f') { const due = addDaysISO(i.date, v.days !== '' && v.days != null ? +v.days : std);
        const x = {form:'herb', it, v, cat:c.n, kind:'ต้องแก้ไข', due}; out.fixes.push(x); out.issues.push(x); if (!rec) out.noRec.push(it.k); }
      else if ((v.s === 'p' || v.s === 'na') && rec) { const x = {form:'herb', it, v, cat:c.n, kind:'ข้อเสนอแนะ', due:''}; out.sugs.push(x); out.issues.push(x); } }
    const pctv = base ? got / base * 100 : 0;
    out.cats.push({n:c.n, title:c.title, got, base, n2:c.items.length, cut, pend, fail, pct:pctv, res: pend ? 'incomplete' : (pctv >= HERB_PASS ? 'pass' : 'fail')});
    out.got += got; out.base += base; out.pending += pend; out.failCount += fail;
  }
  out.issues.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'ต้องแก้ไข' ? -1 : 1));
  out.pct = out.base ? out.got / out.base * 100 : 0;
  out.total = ITEMS.herb.length; out.answered = out.total - out.pending;
  out.result = out.pending ? 'incomplete' : (out.cats.every(x => x.base === 0 || x.pct >= HERB_PASS) && out.pct >= HERB_PASS ? 'pass' : 'fail');
  out.due = out.fixes.map(x => x.due).filter(Boolean).sort().pop() || '';
  out.suggest = out.result === 'incomplete' ? 'รอผลการตรวจให้ครบทุกข้อ' : i.type === 'HS'
    ? (out.fixes.length ? 'แจ้งให้แก้ไขตามประเด็นภายในกำหนด และติดตามผล' : 'ปฏิบัติถูกต้องตามเกณฑ์')
    : (out.result === 'fail' ? 'ไม่ผ่านเกณฑ์: ไม่อนุญาต หรือให้แก้ไขแล้วตรวจซ้ำ' : out.fixes.length ? 'อนุญาต แบบมีเงื่อนไข (แก้ไขตามประเด็นที่แจ้ง)' : 'อนุญาต');
  return out;
}

  brand:'บันทึกการตรวจสถานที่ขายผลิตภัณฑ์สมุนไพรออนไลน์ (ขสมพ.) · ทะเบียนผลการตรวจ พ.ร.บ.ผลิตภัณฑ์สมุนไพร จ.ขอนแก่น',
  card:['พ.ร.บ.สมุนไพร', 'ตรวจสถานที่ขายผลิตภัณฑ์สมุนไพร (ขสมพ.) · แบบ FSNI-PSB-01/04'],
  can: () => !!(S.canHerb && S.user && !isGuest()),
  load: r => { S.canHerb = !!r.canHerb; S.hplaces = sortPlaces(r.hplaces || []); S.hinsps = r.hregs || []; S.hf = S.hf || {fy:'', res:'', type:'', q:'', area:''}; if (S.hpq == null) S.hpq = ''; },
  list: () => S.hinsps || [],
  views:{hreg:() => hViewReg(), hplaces:() => hViewPlaces(), hplace:() => hViewPlace(), hnew:() => hViewNew()},
  navItems:[['hreg','ทะเบียนผลตรวจ',['hreg']], ['hplaces','ฐานข้อมูลสถานที่',['hplaces','hplace']], ['hnew','+ตรวจใหม่',['hnew']]],
  forms: () => ['herb'],
  tabs:{info:hTabInfo, herb:hTabForm, hsum:hTabSum, sign:hTabSign, hfin:hTabFin},
  tabsDef:() => hTabsDef(), schedule:() => hScheduleSummary(), syncItem:el => hSyncItem(el), missing:() => hMissing(), needed:() => ITEMS.herb.length,
  refreshCalc:() => hRefreshCalc(), finishView:() => hFinishView(), finish:() => hFinish(), showResult:() => hShowResult(), emailBody:() => hEmailBody(), buildReport:() => hBuildReport(),
  sub: i => 'ขสมพ. · ' + (HTYPE[i.type] || ''),
  subj:'ผลการตรวจสถานที่ขายผลิตภัณฑ์สมุนไพร ', emailPh:'อีเมลผู้ประกอบการ (กรอกที่แท็บ "ข้อมูลการตรวจ")', rcpt:'ผู้รับ (ผู้ขออนุญาต/ผู้รับอนุญาต)',
  pdfDesc:'ไฟล์ PDF ประกอบด้วย ส่วน ก–ข ข้อมูลการตรวจ แบบประเมิน 35 ข้อ สรุปผลการตรวจ ประเด็นที่ต้องแก้ไขและข้อเสนอแนะ ลายมือชื่อ และรูปภาพประกอบ ระบบเก็บสำเนาไว้ใน Google Drive ทุกครั้งที่สร้าง'};

/* ============ act chooser (พ.ร.บ.อาหาร / ยา / สมุนไพร), module nav, branding ============ */
function setAct(a) {
  S.act = a; try { localStorage.setItem('gmp_act', a); } catch {}
  const M = actMod();
  if (M) S.view = M.home; else if (a === 'food' && (!S.view || S.view === 'edit' || Object.values(MODS).some(x => x.views[S.view]))) S.view = 'reg';
  render(); window.scrollTo(0, 0); if (a) refreshList();
}
function viewAct() {
  const card = (a, title, sub, ok, note, mark) => h('button', {class:'act-card ' + a, disabled:!ok, onclick: () => setAct(a)},
    h('span', {class:'act-mark', 'aria-hidden':'true'}, mark), h('b', null, title), h('span', null, sub), note ? h('span', {class:'act-note'}, note) : null);
  return h('div', {class:'act-wrap'},
    h('div', {class:'eyebrow', style:'text-align:center'}, 'ระบบ ตามตรวจ · สวัสดี ' + (S.user.name || S.user.username)),
    h('h1', {style:'text-align:center'}, 'เลือก พ.ร.บ. ที่ต้องการตรวจ'),
    h('div', {class:'act-grid'},
      card('food', 'พ.ร.บ.อาหาร', 'ตรวจสถานที่ผลิตอาหาร (GMP) · แบบ ตส.1 – ตส.5', true, null, 'อาหาร'),
      ...Object.values(MODS).map(M => card(M.act, M.card[0], M.card[1], M.can(), M.can() ? 'ช่วงทดลองใช้งาน' : 'ช่วงทดลองเปิดให้เฉพาะเจ้าหน้าที่ สสจ.', M.mark))),
    h('p', {class:'small muted', style:'text-align:center'}, 'เปลี่ยน พ.ร.บ. ได้ทุกเมื่อจากปุ่มด้านบน'));
}
function actPill() {
  const M = actMod();
  return h('button', {class:'act-pill', title:'เปลี่ยน พ.ร.บ.', onclick: () => { if (S.view === 'edit') leaveEditor(); S.cur = null; S.act = ''; try { localStorage.removeItem('gmp_act'); } catch {} render(); }},
    M ? M.name : 'พ.ร.บ.อาหาร', h('span', {'aria-hidden':'true'}, ' ⇄'));
}
function modNav(nav, M) {
  nav.replaceChildren(actPill(),
    ...M.navItems.map(([v, l, cur]) => h('button', {'aria-current': cur.includes(S.view) ? 'page' : null, onclick: () => go(v)}, l)),
    isAdmin() ? h('button', {'aria-current': S.view === 'users' ? 'page' : null, onclick: () => go('users')}, 'ผู้ใช้งาน') : null,
    h('button', {class:'acct', onclick:accountDialog, title:'บัญชีผู้ใช้'}, S.user.name || S.user.username));
}
function brandSync() {
  const M = curMod() || actMod(), m = $('.brand-mark'), s = $('.brand span');
  for (const k of ['drug', 'herb']) document.body.classList.toggle('act-' + k, !!M && M.act === k);
  if (m) m.textContent = M ? M.mark : 'GMP';
  if (s) s.textContent = M ? M.brand : 'แบบตรวจ GMP ออนไลน์ ตส.1 – ตส.5 · ทะเบียนผลการตรวจสถานที่ผลิตอาหาร จ.ขอนแก่น';
}
boot();

</script>
</body>
</html>
